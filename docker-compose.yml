services:

  # ─── MySQL ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: classease-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: classease
      MYSQL_USER: classease
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - classease
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: classease-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - classease
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Laravel (PHP-FPM) ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: classease-app
    container_name: classease-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: Laravel
      APP_ENV: local
      APP_KEY: base64:uHwIPUh+mRmKjac8WKVQ+yHZYjn+nz8JtquIhS7xtbY=
      APP_DEBUG: "true"
      APP_URL: http://localhost

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: classease
      DB_USERNAME: classease
      DB_PASSWORD: secret

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
    volumes:
      - ./Backend:/var/www/html
      - php-vendor:/var/www/html/vendor
      - php-node-modules:/var/www/html/node_modules
    networks:
      - classease
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Queue Worker ──────────────────────────────────────
  queue:
    image: classease-app
    container_name: classease-queue
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: Laravel
      APP_ENV: local
      APP_KEY: base64:uHwIPUh+mRmKjac8WKVQ+yHZYjn+nz8JtquIhS7xtbY=
      APP_DEBUG: "true"
      APP_URL: http://localhost

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: classease
      DB_USERNAME: classease
      DB_PASSWORD: secret

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./Backend:/var/www/html
      - php-vendor:/var/www/html/vendor
      - php-node-modules:/var/www/html/node_modules
    networks:
      - classease
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  # ─── React Client (Vite dev server) ────────────────────
  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    container_name: classease-client
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://nginx
    ports:
      - "5174:5173"
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    networks:
      - classease

  # ─── Nginx (reverse proxy) ─────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: classease-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./Backend/public:/var/www/html/public
    networks:
      - classease

# ─── Networks ────────────────────────────────────────────
networks:
  classease:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────
volumes:
  mysql-data:
  php-vendor:
  php-node-modules:
  client-node-modules:
